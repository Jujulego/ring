[package]
name = "ring-module-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
rgb = { version = "0.8.50", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
sysinfo = "0.35.0"
toml = "0.8.22"
tracing = "0.1.41"

ring-core-content = { path = "../ring-core-content" }
ring-core-fs = { path = "../ring-core-fs" }
ring-core-modules = { path = "../ring-core-modules" }
ring-core-tasks = { path = "../ring-core-tasks" }
ring-core-units = { path = "../ring-core-units" }
ring-module-toml = { path = "../ring-module-toml" }

[dev-dependencies]
indoc = "2.0.6"
