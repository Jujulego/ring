[package]
name = "ring-cli"
version = "0.4.0"
edition = "2021"

[features]
default = []

[dependencies]
anyhow = "1.0.97"
clap = "4.5.32"
crossterm = "0.28.1"
lscolors = { version = "0.20.0", default-features = false, features = ["crossterm"] }
sentry = { version = "0.36.0", features = ["anyhow", "tracing"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

ring-cli-fs = { path = "../ring-cli-fs" }
ring-core = { path = "../ring-core", features = ["rust"] }
ring-core-language = { path = "../ring-core-language" }