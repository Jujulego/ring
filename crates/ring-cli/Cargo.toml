[package]
name = "ring-cli"
version = "0.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0.93"
clap = "4.5.20"
itertools = "0.13.0"
lscolors = { version = "0.20.0", features = ["owo-colors"] }
owo-colors = "4.1.0"
sentry = { version = "0.34.0", features = ["anyhow", "tracing"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

ring-cli-table = { path = "../ring-cli-table" }
ring-code-unit = { path = "../ring-code-unit" }
ring-tag = { path = "../ring-tag", features = ["owo"] }
ring-web = { path = "../ring-web" }