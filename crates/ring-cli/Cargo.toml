[package]
name = "ring-cli"
version = "0.0.0"
edition = "2021"

[features]
default = ["web"]
web = ["dep:ring-web"]

[dependencies]
anyhow = "1.0.93"
bytesize = "1.3.0"
clap = "4.5.20"
itertools = "0.13.0"
lscolors = { version = "0.20.0", features = ["owo-colors"] }
owo-colors = { version = "4.1.0", features = ["supports-colors"] }
sentry = { version = "0.35.0", features = ["anyhow", "tracing"] }
supports-color = "3.0.1"
sysinfo = "0.33.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

ring-cli-table = { path = "../ring-cli-table" }
ring-core = { path = "../ring-core" }
ring-tag = { path = "../ring-tag", features = ["owo-colors"] }
ring-web = { path = "../ring-web", features = ["owo-colors"], optional = true }