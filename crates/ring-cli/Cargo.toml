[package]
name = "ring-cli"
version = "0.0.0"
edition = "2021"

[features]
default = ["rust", "web"]
rust = ["dep:ring-rust"]
web = ["dep:ring-web"]

[dependencies]
anyhow = "1.0.93"
bytesize = "2.0.1"
clap = "4.5.20"
crossterm = "0.28.1"
itertools = "0.14.0"
lscolors = { version = "0.20.0", features = ["crossterm"] }
sentry = { version = "0.36.0", features = ["anyhow", "tracing"] }
supports-color = "3.0.2"
sysinfo = "0.33.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

ring-cli-table = { path = "../ring-cli-table" }
ring-core = { path = "../ring-core" }
ring-rust = { path = "../ring-rust", features = ["crossterm"], optional = true }
ring-tag = { path = "../ring-tag", features = ["crossterm"] }
ring-web = { path = "../ring-web", features = ["crossterm"], optional = true }