[package]
name = "ring-module-javascript"
version = "0.1.0"
edition = "2024"

[features]
crossterm = ["dep:crossterm", "ring-core-tasks/crossterm"]

[dependencies]
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sysinfo = "0.35.0"
tracing = "0.1.41"

crossterm = { version = "0.29.0", optional = true }

ring-core-content = { path = "../ring-core-content" }
ring-core-modules = { path = "../ring-core-modules" }
ring-core-tasks = { path = "../ring-core-tasks" }
ring-core-units = { path = "../ring-core-units" }
ring-module-json = { path = "../ring-module-json" }
ring-module-yaml = { path = "../ring-module-yaml" }