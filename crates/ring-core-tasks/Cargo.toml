[package]
name = "ring-core-tasks"
version = "0.1.0"
edition = "2024"

[features]
crossterm = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29.0", optional = true }
rgb = { version = "0.8.50", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
sysinfo = "0.36.0"

ring-core-units = { path = "../ring-core-units" }